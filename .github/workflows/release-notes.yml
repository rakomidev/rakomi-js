name: Create GitHub Release (Notes + SBOM + SECURITY.md)

# ─────────────────────────────────────────────────────────────────────────────────────────────
# STAGED TEMPLATE. Authored in the private monorepo under `public-repo-template/` and copied
# verbatim into `rakomidev/rakomi-js` at cutover, same as publish.yml (see that file's own header).
# It NEVER runs in the monorepo.
#
# WHY A SEPARATE WORKFLOW, NOT A STEP APPENDED TO publish.yml: the publish job's `permissions:` is
# statically pinned to EXACTLY `{contents: read, id-token: write}` by `check-public-publish-workflow.mjs`
# ("job-scoped, exactly two keys" — and that gate bounds EVERY permissions block in the file, not
# only the id-token one). Creating a GitHub Release + uploading assets needs `contents: write`, which
# that gate correctly refuses to allow anywhere near the OIDC-publish job — widening the blast radius of
# the job holding the npm trusted-publishing identity is exactly the invariant that gate exists to prevent.
# This workflow is therefore a genuinely separate file: `contents: write`, NO `id-token` at all — it
# never touches the npm publish credential and cannot widen its blast radius.
#
# DIAGNOSIS this closes: no workflow anywhere in this pipeline ever created a GitHub Release.
# v0.1.0's four releases (with Notes) were created by hand from a laptop after the fact; v0.2.0 got
# none at all — zero assets on any of the earlier rows. This workflow makes release creation part
# of the SAME tag-triggered pipeline that already publishes to npm, so it happens the same way
# every time instead of depending on a human remembering a follow-up step.
#
# ORDERING / INDEPENDENCE: this workflow is triggered by the SAME tag push as publish.yml and runs in
# PARALLEL with it — there is no `needs:` (cross-workflow dependencies need `workflow_run`, which this
# story avoids to keep the trigger identical + auditable). Instead this job waits for npm itself to
# confirm the version is live (bounded poll) before doing anything — so it never creates a release for a
# publish that is still in flight or that failed. A publish failure means this workflow's poll times out
# and the job fails LOUD (visible red run) without touching GitHub Releases — it never fabricates a
# release for a version that never actually shipped.
#
# IDEMPOTENT BY CONSTRUCTION: `gh release view` decides create-vs-edit; asset upload always uses
# `--clobber`. Re-running this workflow for a tag that already has a release (a manual re-dispatch, or a
# second delivery of the same tag-push webhook) can only ever converge on the SAME state, never duplicate
# a release or fail on "already exists".
# ─────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "sdk/v[0-9]*.[0-9]*.[0-9]*"
      - "sdk-core/v[0-9]*.[0-9]*.[0-9]*"
      - "react/v[0-9]*.[0-9]*.[0-9]*"
      - "react-native/v[0-9]*.[0-9]*.[0-9]*"
      - "create-rakomi-app/v[0-9]*.[0-9]*.[0-9]*"
  # SAFE here, unlike publish.yml (which forbids workflow_dispatch to protect the OIDC publish
  # identity): this workflow holds NO OIDC/npm credential, only `contents: write`. Re-dispatching
  # against an ALREADY-published tag (`gh workflow run release-notes.yml --ref <tag>`) is the sanctioned
  # backfill path for a tag whose original push predates this workflow existing on the mirror (the exact
  # 0.2.0 gap) — idempotent by construction (see the create-or-update + --clobber steps below), so a
  # re-run against a tag that already has a release converges, never duplicates.
  workflow_dispatch: {}

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload — the ONLY write this workflow ever needs; no id-token anywhere in this file
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve package from the protected tag (same map publish.yml uses)
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/sdk/v*)               PKG_DIR=packages/sdk;               PKG_NAME=@rakomi/node;         PREFIX=sdk/v ;;
            refs/tags/sdk-core/v*)          PKG_DIR=packages/sdk-core;          PKG_NAME=@rakomi/sdk-core;     PREFIX=sdk-core/v ;;
            refs/tags/react/v*)             PKG_DIR=packages/react;             PKG_NAME=@rakomi/react;        PREFIX=react/v ;;
            refs/tags/react-native/v*)      PKG_DIR=packages/react-native;      PKG_NAME=@rakomi/react-native; PREFIX=react-native/v ;;
            refs/tags/create-rakomi-app/v*) PKG_DIR=packages/create-rakomi-app; PKG_NAME=create-rakomi-app;    PREFIX=create-rakomi-app/v ;;
            *) echo "ERROR: tag $REF is not a recognized per-package release namespace"; exit 1 ;;
          esac
          {
            echo "PKG_DIR=$PKG_DIR"
            echo "PKG_NAME=$PKG_NAME"
            echo "TAG_VERSION=${REF#refs/tags/${PREFIX}}"
            echo "TAG_NAME=${REF#refs/tags/}"
          } >> "$GITHUB_ENV"

      # Independent of publish.yml's own run: this job asks npm directly whether the bytes are live
      # before doing anything else, so a slow/failed publish never produces a release for nothing.
      # Bounded (10 min) — matches the retry window publish.yml's own post-publish checks use for npm's
      # attestation-indexing lag.
      - name: Wait for npm to confirm this version is published
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if npm view "${PKG_NAME}@${TAG_VERSION}" version >/dev/null 2>&1; then
              echo "npm confirms ${PKG_NAME}@${TAG_VERSION} is published (attempt ${attempt})"
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm never showed ${PKG_NAME}@${TAG_VERSION} as published after 10 minutes — publish.yml may still be running or may have failed. Refusing to create a release for an unconfirmed version."
          exit 1

      - name: Extract this version's CHANGELOG entry (Keep-a-Changelog-style, generated by Layer 1)
        run: |
          set -euo pipefail
          awk -v ver="## ${TAG_VERSION} " 'BEGIN{p=0} $0==ver{p=1} p==1 && $0!=ver && /^## /{exit} p==1{print}' "${PKG_DIR}/CHANGELOG.md" > /tmp/changelog-entry.md
          if [ ! -s /tmp/changelog-entry.md ]; then
            echo "No matching CHANGELOG.md entry for ${TAG_VERSION} — falling back to a minimal note." >&2
            printf '## %s\n\nSee the npm package page for details.\n' "${TAG_VERSION}" > /tmp/changelog-entry.md
          fi

      - name: Build release notes body
        run: |
          set -euo pipefail
          DESCRIPTION=$(node -p "require('./${PKG_DIR}/package.json').description || ''")
          {
            printf '# %s %s\n\n' "$PKG_NAME" "$TAG_VERSION"
            [ -n "$DESCRIPTION" ] && printf '%s\n\n' "$DESCRIPTION"
            printf '## Install\n```\nnpm install %s\n```\n\n' "$PKG_NAME"
            cat /tmp/changelog-entry.md
            printf '\n## Provenance (verify it yourself)\nPublished from GitHub Actions via npm Trusted Publishing (OIDC), with SLSA Build L2 provenance and a Sigstore transparency-log (Rekor) entry. Verify the way a consumer does:\n```\nnpm audit signatures\n```\n\n'
            printf '## Versioning & support\nThis is a **0.x** release — the public API may still change (SemVer 2.0.0 §4). Independently of SemVer, the EU Cyber Resilience Act (Regulation (EU) 2024/2847) Art. 13(8) support obligation attaches at market placement.\n\n'
            printf '## Docs\nhttps://docs.rakomi.dev/sdk/\n'
          } > /tmp/release-notes.md

      # The AUTHORITATIVE published bytes — extracted from the exact tarball npm serves, never
      # re-generated locally (a local re-run of generate-sbom.mjs could drift from what actually shipped).
      - name: Fetch the published tarball's SBOM + collect SECURITY.md
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          TMPDIR_PACK=$(mktemp -d)
          npm pack "${PKG_NAME}@${TAG_VERSION}" --pack-destination "$TMPDIR_PACK" --silent
          TGZ=$(find "$TMPDIR_PACK" -maxdepth 1 -name '*.tgz' | head -1)
          test -n "$TGZ" || { echo "::error::npm pack produced no tarball for ${PKG_NAME}@${TAG_VERSION}"; exit 1; }
          tar -xzf "$TGZ" -C "$TMPDIR_PACK" package/sbom.cdx.json
          cp "$TMPDIR_PACK/package/sbom.cdx.json" /tmp/release-assets/sbom.cdx.json
          cp SECURITY.md /tmp/release-assets/SECURITY.md

      # Idempotent create-or-update: a re-run (manual re-dispatch, duplicate tag-push delivery) converges
      # on the SAME release rather than erroring "already exists" or leaving stale Notes.
      - name: Create or update the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if command gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists — updating notes."
            command gh release edit "${TAG_NAME}" --title "${PKG_NAME} ${TAG_VERSION}" --notes-file /tmp/release-notes.md
          else
            command gh release create "${TAG_NAME}" --title "${PKG_NAME} ${TAG_VERSION}" --notes-file /tmp/release-notes.md
          fi

      - name: Upload assets — SBOM + SECURITY.md (idempotent — --clobber overwrites a prior run's copy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: command gh release upload "${TAG_NAME}" /tmp/release-assets/sbom.cdx.json /tmp/release-assets/SECURITY.md --clobber
