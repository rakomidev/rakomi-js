name: Create GitHub Release (Notes + SBOM + SECURITY.md)

# Runs after the Publish workflow completes; workflow_dispatch creates the release for an already-published version.
on:
  workflow_run:
    workflows: ["Publish @rakomi/* (OIDC trusted publishing + SLSA provenance)"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  # workflow_run always carries github.ref == the default branch (it is not the tag's own ref) — the
  # real per-package identity for this trigger is head_branch (the tag name GitHub reports for a run
  # that was itself triggered by a tag push). Falling back to github.ref keeps workflow_dispatch's
  # existing behavior (dispatched against a tag ref) unchanged.
  group: release-notes-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-notes:
    # A failed/cancelled Publish run must never produce a release for a version that never shipped.
    # workflow_dispatch carries no workflow_run context at all, so it is admitted unconditionally (the
    # existing backfill path — the dispatched ref is validated by the resolution step below, same as before).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      # Resolve the trigger ref FIRST — workflow_dispatch keeps its existing github.ref (a tag ref,
      # e.g. from the §11.4 backfill command); workflow_run has no tag ref of its own, so the tag name
      # is read from head_branch (GitHub reports the tag's bare name there for a run a tag push
      # triggered — verified against GitHub's own event semantics). head_branch is UNVALIDATED input at
      # this point (any tag pusher's ref name flows through it) — it is turned into REF by plain string
      # concatenation (never interpolated into an executed command) and immediately fed through the SAME
      # case statement that resolves the package, which is therefore also the validator: an unrecognized
      # value hits the existing `*) exit 1` branch before PKG_DIR/PKG_NAME/TAG_VERSION are ever set from
      # it. One case statement, two jobs — reused, never a second regex.
      - name: Resolve the trigger ref, then the package from the protected tag (same map publish.yml uses)
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            REF="refs/tags/${WR_HEAD_BRANCH}"
          else
            REF="$GH_REF"
          fi
          case "$REF" in
            refs/tags/sdk/v*)               PKG_DIR=packages/sdk;               PKG_NAME=@rakomi/node;         PREFIX=sdk/v ;;
            refs/tags/sdk-core/v*)          PKG_DIR=packages/sdk-core;          PKG_NAME=@rakomi/sdk-core;     PREFIX=sdk-core/v ;;
            refs/tags/react/v*)             PKG_DIR=packages/react;             PKG_NAME=@rakomi/react;        PREFIX=react/v ;;
            refs/tags/react-native/v*)      PKG_DIR=packages/react-native;      PKG_NAME=@rakomi/react-native; PREFIX=react-native/v ;;
            refs/tags/create-rakomi-app/v*) PKG_DIR=packages/create-rakomi-app; PKG_NAME=create-rakomi-app;    PREFIX=create-rakomi-app/v ;;
            refs/tags/cli/v*)               PKG_DIR=packages/cli;               PKG_NAME=rakomi;               PREFIX=cli/v ;;
            *) echo "ERROR: tag $REF is not a recognized per-package release namespace"; exit 1 ;;
          esac
          {
            echo "PKG_DIR=$PKG_DIR"
            echo "PKG_NAME=$PKG_NAME"
            echo "TAG_VERSION=${REF#refs/tags/${PREFIX}}"
            echo "TAG_NAME=${REF#refs/tags/}"
          } >> "$GITHUB_ENV"

      # No longer the race-avoidance mechanism (workflow_run already waited for Publish to finish
      # successfully) — this is now belt-and-suspenders against npm registry read-replication lag only,
      # so the bound shrinks from 10 minutes to ~1 minute.
      - name: Wait for npm to confirm this version is published (registry replication lag only)
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if npm view "${PKG_NAME}@${TAG_VERSION}" version >/dev/null 2>&1; then
              echo "npm confirms ${PKG_NAME}@${TAG_VERSION} is published (attempt ${attempt})"
              exit 0
            fi
            sleep 5
          done
          echo "::error::npm never showed ${PKG_NAME}@${TAG_VERSION} as published after 60s of publish.yml reporting success — this points at registry replication lag or a publish that failed after this workflow's own trigger fired. Refusing to create a release for an unconfirmed version."
          exit 1

      - name: Extract this version's CHANGELOG entry (Keep-a-Changelog-style, generated by Layer 1)
        run: |
          set -euo pipefail
          awk -v ver="## ${TAG_VERSION} " 'BEGIN{p=0} $0==ver{p=1} p==1 && $0!=ver && /^## /{exit} p==1{print}' "${PKG_DIR}/CHANGELOG.md" > /tmp/changelog-entry.md
          if [ ! -s /tmp/changelog-entry.md ]; then
            echo "No matching CHANGELOG.md entry for ${TAG_VERSION} — falling back to a minimal note." >&2
            printf '## %s\n\nSee the npm package page for details.\n' "${TAG_VERSION}" > /tmp/changelog-entry.md
          fi

      - name: Build release notes body
        run: |
          set -euo pipefail
          DESCRIPTION=$(node -p "require('./${PKG_DIR}/package.json').description || ''")
          {
            printf '# %s %s\n\n' "$PKG_NAME" "$TAG_VERSION"
            [ -n "$DESCRIPTION" ] && printf '%s\n\n' "$DESCRIPTION"
            printf '## Install\n```\nnpm install %s\n```\n\n' "$PKG_NAME"
            cat /tmp/changelog-entry.md
            printf '\n## Provenance (verify it yourself)\nPublished from GitHub Actions via npm Trusted Publishing (OIDC), with SLSA Build L2 provenance and a Sigstore transparency-log (Rekor) entry. Verify the way a consumer does:\n```\nnpm audit signatures\n```\n\n'
            printf '## Versioning & support\nThis is a **0.x** release — the public API may still change (SemVer 2.0.0 §4). Independently of SemVer, the EU Cyber Resilience Act (Regulation (EU) 2024/2847) Art. 13(8) support obligation attaches at market placement.\n\n'
            printf '## Docs\nhttps://docs.rakomi.dev/sdk/\n'
          } > /tmp/release-notes.md

      - name: Fetch the published tarball's SBOM + collect SECURITY.md
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          TMPDIR_PACK=$(mktemp -d)
          npm pack "${PKG_NAME}@${TAG_VERSION}" --pack-destination "$TMPDIR_PACK" --silent
          TGZ=$(find "$TMPDIR_PACK" -maxdepth 1 -name '*.tgz' | head -1)
          test -n "$TGZ" || { echo "::error::npm pack produced no tarball for ${PKG_NAME}@${TAG_VERSION}"; exit 1; }
          tar -xzf "$TGZ" -C "$TMPDIR_PACK" package/sbom.cdx.json
          cp "$TMPDIR_PACK/package/sbom.cdx.json" /tmp/release-assets/sbom.cdx.json
          cp SECURITY.md /tmp/release-assets/SECURITY.md

      - name: Create or update the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if command gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists — updating notes."
            command gh release edit "${TAG_NAME}" --title "${PKG_NAME} ${TAG_VERSION}" --notes-file /tmp/release-notes.md
          else
            command gh release create "${TAG_NAME}" --title "${PKG_NAME} ${TAG_VERSION}" --notes-file /tmp/release-notes.md
          fi

      - name: Upload assets — SBOM + SECURITY.md (idempotent — --clobber overwrites a prior run's copy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: command gh release upload "${TAG_NAME}" /tmp/release-assets/sbom.cdx.json /tmp/release-assets/SECURITY.md --clobber
