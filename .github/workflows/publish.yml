name: Publish @rakomi/* (OIDC trusted publishing + SLSA provenance)

# ─────────────────────────────────────────────────────────────────────────────────────────────
# STAGED TEMPLATE. This file is AUTHORED in the private monorepo under `public-repo-template/` and
# is COPIED verbatim into the PUBLIC repo `rakomidev/rakomi-js` at cutover. It NEVER runs in the
# monorepo (the monorepo has no SDK orphan tree to publish, and runs no publish workflow). Its
# STATIC hardening invariants are verified in the monorepo by
# `scripts/check-public-publish-workflow.mjs` (a pure-function gate over this text), so the
# irreversible publish path is reviewer-proof BEFORE the public repo exists.
#
# Honesty model: npm derives provenance from THIS workflow's OIDC identity + the tarball SHA-512
# only. The public repo therefore holds REAL inspectable source (orphan clean-room snapshot) and
# publishes the exact verified bytes. There is NO long-lived publish credential anywhere:
# publishing authenticates via the workflow's short-lived OIDC identity (npm Trusted Publishing GA
# 2025-07-31; needs npm >= 11.5.1; provenance auto-generates).
# ─────────────────────────────────────────────────────────────────────────────────────────────

# The publish job triggers ONLY on a protected per-package tag push. NEVER workflow_dispatch /
# repository_dispatch / pull_request* — those would let a non-tag actor (or a fork PR) reach the
# OIDC publish identity. Retry = a NEW patch tag, never a force-move (tag protection). Per-package
# namespaces: @rakomi/node → sdk/v*; @rakomi/sdk-core → sdk-core/v*; @rakomi/react → react/v*;
# @rakomi/react-native → react-native/v*.
on:
  push:
    tags:
      - "sdk/v[0-9]*.[0-9]*.[0-9]*"
      - "sdk-core/v[0-9]*.[0-9]*.[0-9]*"
      - "react/v[0-9]*.[0-9]*.[0-9]*"
      - "react-native/v[0-9]*.[0-9]*.[0-9]*"
      # create-rakomi-app joined this publish path (operator decision 2026-08-24) rather than
      # getting a bespoke pipeline.
      - "create-rakomi-app/v[0-9]*.[0-9]*.[0-9]*"
      # rakomi (the CLI) joined this publish path (operator decision 2026-08-27) — same shape as
      # create-rakomi-app immediately above.
      - "cli/v[0-9]*.[0-9]*.[0-9]*"

# In-flight publish safety: the `cancel-in-progress` flag is kept false — the load-bearing
# property — so a publish is NEVER killed mid-transaction (a cancelled publish could leave a
# half-minted provenance/tag state). The group keys on the (unique-per-release) tag ref, so it
# serializes only re-runs of the SAME immutable tag — NOT distinct releases, and that is
# sufficient: distinct releases share no mutable cross-release state (each is its own
# export→publish transaction keyed to its own immutable tag — the durable mutex of record; SemVer
# §3 — so two releases can never collide on a version). A single global `group: sdk-release` lock
# (serializing ALL releases) is warranted ONLY if a future fork adds shared mutable cross-release
# state. CI pins this no-cancel flag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level default is read-only. id-token:write is granted ONLY on the publish job
# (job-scoped) so the OIDC token's blast radius is the single intentional write exception.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Bind to a named Environment so the OIDC `sub` is
    # `repo:rakomidev/rakomi-js:environment:release` (tighter than `:ref:`) AND the Environment is
    # the required-reviewer gate (reviewer != release trigger actor).
    environment: release
    # EXACTLY two keys, job-scoped. `id-token: write` is the single intentional write (OIDC → npm
    # trusted publishing + SLSA provenance). A third key here widens the OIDC token's blast radius
    # — `check-public-publish-workflow.mjs` fails CI on any third permission key.
    permissions:
      contents: read
      id-token: write

    steps:
      # FIRST step. OIDC mints provenance even from a PRIVATE repo → "green in CI, dead public
      # link". Refuse to publish unless the repo is PUBLIC on a durable commit SHA. This is the
      # irreversible-path tripwire that gates everything below.
      - name: Assert repository is PUBLIC on a durable SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPO: rakomidev/rakomi-js
        run: |
          set -euo pipefail
          VIS=$(gh repo view "$EXPECTED_REPO" --json visibility --jq '.visibility')
          if [ "$VIS" != "PUBLIC" ]; then
            echo "ERROR: repository visibility is '$VIS', not PUBLIC — publishing while private mints provenance that resolves to a dead public link"
            exit 1
          fi
          if [ -z "${GITHUB_SHA:-}" ] || [ "${#GITHUB_SHA}" -ne 40 ]; then
            echo "ERROR: no durable 40-hex commit SHA for this publish"
            exit 1
          fi
          echo "repo is PUBLIC at $GITHUB_SHA"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # full history: tag→commit reachability for provenance (N3)

      # Legal-reconciliation fence (first CONTENT-based gate, before any build/publish step). The
      # private monorepo's export refuses to assemble this orphan tree unless every legal-blocker
      # determination (CRA citation renumber, export-control basis) is CONFIRMED + director-cleared
      # in the governance log, and ships a LEAK-SAFE `legal-clearance.json` marker (roles + public
      # CELEX only — no names/story ids). This step re-asserts it from the runner so the OIDC
      # publish literally cannot execute on an uncleared tree. No secret, no permission change
      # (static workflow gate unaffected).
      - name: Assert legal reconciliation cleared
        run: |
          set -euo pipefail
          test -f legal-clearance.json || { echo "ERROR: legal-clearance.json missing — the export did not clear the legal-blockers gate"; exit 1; }
          node -e 'const c=require("./legal-clearance.json"); if(c.cleared!==true){console.error("ERROR: legal reconciliation NOT cleared");process.exit(1)}; console.log("legal reconciliation cleared as of "+c.as_of+" (CELEX "+c.celex+")")'

      # The tagged release commit's author/committer + any Co-authored-by/Signed-off-by trailer
      # MUST be a role mailbox — never a personal email (a personal address is permanent +
      # un-erasable once anchored in the public Rekor record). Runs BEFORE the irreversible
      # publish (fail-fast). The provenance-builder identity is the twin post-publish check in
      # check-provenance-predicate.mjs (runDetails.builder.id).
      - name: Build/commit identity scan — no personal email
        run: node scripts/check-build-identity.mjs

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Pin npm to the trusted-publishing floor (>= 11.5.1). The OIDC token-exchange + provenance
      # auto-generation are npm-CLI-version-gated; a too-old bundled npm 401s only at the
      # irreversible publish. NPM_FLOOR is the single named constant (mirrors the monorepo's
      # sdk-toolchain-pin.json `npmPublishFloor`).
      - name: Pin npm CLI to the trusted-publishing floor
        env:
          NPM_FLOOR: "11.5.1"
        run: npm install -g "npm@${NPM_FLOOR}"

      # Resolve which package this tag publishes (N-package-generic: driven by the tag prefix,
      # never a per-package workflow). NPM_TAG_PREFIX is the protected namespace; PKG_DIR/PKG_NAME
      # flow to the steps below via $GITHUB_ENV.
      - name: Resolve package from the protected tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/sdk/v*)               PKG_DIR=packages/sdk;               PKG_NAME=@rakomi/node;         PREFIX=sdk/v ;;
            refs/tags/sdk-core/v*)          PKG_DIR=packages/sdk-core;          PKG_NAME=@rakomi/sdk-core;     PREFIX=sdk-core/v ;;
            refs/tags/react/v*)             PKG_DIR=packages/react;             PKG_NAME=@rakomi/react;        PREFIX=react/v ;;
            refs/tags/react-native/v*)      PKG_DIR=packages/react-native;      PKG_NAME=@rakomi/react-native; PREFIX=react-native/v ;;
            refs/tags/create-rakomi-app/v*) PKG_DIR=packages/create-rakomi-app; PKG_NAME=create-rakomi-app;    PREFIX=create-rakomi-app/v ;;
            refs/tags/cli/v*)               PKG_DIR=packages/cli;               PKG_NAME=rakomi;               PREFIX=cli/v ;;
            *) echo "ERROR: tag $REF is not a recognized per-package release namespace"; exit 1 ;;
          esac
          {
            echo "PKG_DIR=$PKG_DIR"
            echo "PKG_NAME=$PKG_NAME"
            echo "TAG_VERSION=${REF#refs/tags/${PREFIX}}"
          } >> "$GITHUB_ENV"
          echo "publishing $PKG_NAME from $PKG_DIR"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # NOTE (retired): the in-CI npm trusted-publisher read-back preflight was removed. Its design
      # (`npm access get trusted-publisher …`) rested on an npm CLI/registry command that does not
      # exist, and the real read-back path (`npm trust list` → `GET /-/package/<pkg>/trust`) is an
      # AUTHENTICATED call — impossible in this deliberately tokenless OIDC-only job. A
      # misconfigured or absent trusted publisher is caught FAIL-CLOSED at the publish step itself:
      # OIDC token exchange 404s and no bytes are published (a 404 mints nothing). The
      # trusted-publisher config is instead verified OUT-OF-BAND by the release authorizer before
      # tagging (`npm trust list @rakomi/<pkg>`), and the post-publish provenance gates
      # (subject-digest / predicate-scrub / Rekor-issuer) remain the cryptographic net.

      # Pack-once, FULL publishable set: the release-gates below enforce anti-vacuous
      # count-equality over the FULL publishable set, so build + SBOM + pack ALL publishable packages here
      # even though only the tag's package is published. The published bytes are still the EXACT gated bytes
      # (the tagged package's tarball IS in the gated set). A per-package pack of only PKG_NAME left
      # the gates under-covered ("expected N, inspected 1").
      - name: Build all publishable packages (full set)
        run: pnpm exec turbo run build --force

      # NOTE: no `run test` here. The PUBLIC repo verifies the
      # self-contained orphan tree ONLY (build + pack + release-gates + provenance); the package unit
      # tests run in the MONOREPO CI before cutover. The clean-room orphan ships `src/**` only — no test
      # files and no vitest devDep — so `pnpm run test` (`vitest run`) has nothing to execute and fails
      # `vitest: not found`. The build → pack → gates → provenance chain is the artifact-level proof.

      # Generate the sbom.cdx.json + THIRD-PARTY-NOTICES that each package's files[] ships, from the freshly
      # built dist, BEFORE pack — for EVERY publishable package (the full-set pack below ships each one's sbom
      # and the sbom-equals-lockfile gate verifies each). The ONE gate-equal generator (scripts/generate-sbom.mjs,
      # story sdk-sbom-generator-externalised-closure) serializes the sbom-equals-lockfile gate's `expected`
      # (computeExpectedComponentSet) so the SBOM is set-EQUAL to the gate BY CONSTRUCTION for ALL packages —
      # covering BOTH the inlined half (metafile-bundled) AND the externalised runtime deps (jose,
      # @rakomi/sdk-core) the prior cyclonedx-npm/metafile-to-cdx split left unaccounted → the N4P coverage
      # precondition clears. --validate runs the offline CycloneDX 1.6 schema check + deny-list scan. THIRD-
      # PARTY-NOTICES stays on metafile-to-notices for the bundled trio (emitted from the SAME component set).
      # The committed pnpm-lock.yaml is the resolution ground-truth the generator's `pnpm ls` closure reads.
      - name: Generate SBOM + third-party notices — full set (CRA Annex I Part II)
        run: |
          set -euo pipefail
          node scripts/generate-sbom.mjs --validate
          # tsc-built packages (METAFILE_LESS_PACKAGES in sdk-supply-chain-common.mjs — the ONE list the
          # orphan drill also reads) produce no dist/ metafile — metafile-to-notices skips them.
          node -e "import('./scripts/lib/sdk-supply-chain-common.mjs').then(m=>{const {packages}=m.enumeratePublishablePackages(process.cwd());process.stdout.write(packages.filter(p=>!m.METAFILE_LESS_PACKAGES.includes(p.name)).map(p=>p.dir).join('\n'))})" \
            | while IFS= read -r DIR; do
                [ -n "$DIR" ] && node scripts/metafile-to-notices.mjs --pkg "$DIR"
              done

      # Build-once, publish-the-verified-bytes: pack ONCE here; the gates below inspect THIS tarball
      # SET; `npm publish ./<tgz>` ships the EXACT same bytes (no re-build, no prepublishOnly mutation).
      # pnpm `pack` does NOT accept `--filter` (that flag flips pnpm into recursive mode and `pack` rejects
      # `--recursive` → "Unknown option: 'recursive'"), so pack from INSIDE each package dir. Pack the FULL
      # publishable set; publish only the tagged package's bytes ($TGZ, matched by exact name-version).
      - name: Pack the verified tarballs — full set
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tgz"
          for DIR in $(node -e "import('./scripts/lib/sdk-supply-chain-common.mjs').then(m=>{const {packages}=m.enumeratePublishablePackages(process.cwd());process.stdout.write(packages.map(p=>p.dir).join('\n'))})"); do
            ( cd "$DIR" && pnpm pack --pack-destination "$RUNNER_TEMP/tgz" )
          done
          TARBALL_PREFIX=$(printf '%s' "$PKG_NAME" | sed 's|@||; s|/|-|g')
          TGZ="$RUNNER_TEMP/tgz/${TARBALL_PREFIX}-${TAG_VERSION}.tgz"
          test -f "$TGZ" || { echo "ERROR: expected tarball $TGZ not found after pack"; ls -la "$RUNNER_TEMP/tgz"; exit 1; }
          GATE_SHA512=$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write('sha512:'+c.createHash('sha512').update(f.readFileSync(process.argv[1])).digest('hex'))" "$TGZ")
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"
          echo "GATE_SHA512=$GATE_SHA512" >> "$GITHUB_ENV"
          echo "packed full set; publishing $TGZ ($GATE_SHA512)"

      # The published package's repository.url MUST byte-equal github.com/rakomidev/rakomi-js
      # (npm rejects a mismatch with HTTP 422, and an exact match is the honesty requirement).
      # Checked against the PACKED tarball's manifest (the bytes that ship).
      - name: Provenance repo-match (byte-string, not a regex)
        run: node scripts/check-provenance-repo-match.mjs --tarball "$TGZ"

      # The git tag must match package.json version (cannot publish wrong version under a tag).
      - name: Validate tag matches package.json version
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag version ${TAG_VERSION} != package.json version ${PKG_VERSION}"
            exit 1
          fi
        working-directory: ${{ env.PKG_DIR }}

      # @rakomi/sdk-core MUST already exist on the registry before any dependent (@rakomi/node /
      # react / react-native) publishes a `^0.x` range to it. sdk-core publishing itself skips the
      # guard. `^0.x` pins the MINOR.
      - name: Publish-order guard — sdk-core resolvable first
        run: node scripts/check-publish-order.mjs --package "$PKG_NAME"

      # gitleaks for the KEPT no-secrets-in-tarball gate's gitleaks limb — version-pinned +
      # checksum-verified against the gitleaks project's own checksums.txt (no new third-party
      # action). The gate reads the ported gitleaks.toml. WITHOUT this binary a clean tarball's
      # gitleaks limb ENOENTs → CANNOT-EVALUATE → aggregate exit 2. Mirrors the monorepo ci.yml
      # install block.
      - name: Install gitleaks (pinned, checksum-verified) for the no-secrets gate
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # ── RELEASE-GATE FLOOR — ported registry. Runs immediately before the irreversible publish,
      # over the SAME packed tarball, with NO manifest-mutating step between. The orchestrator is
      # exit-2-dominates-exit-1 (no-vacuous-green); a red here MUST block the publish.
      - name: Release gates — supply-chain floor [DANGER]
        run: node scripts/run-release-gates.mjs --tarball "$RUNNER_TEMP/tgz" --no-build
      - name: Pack-install gate (zero workspace:* leak + sdk-core-as-real-dep) [DANGER]
        run: node scripts/sdk-pack-install-gate.mjs --tarball "$RUNNER_TEMP/tgz"

      # ── The irreversible publish. OIDC-only (no NODE_AUTH_TOKEN / no stored npm token).
      # Publishes the EXACT packed bytes. --provenance auto-attaches the SLSA Build L2 predicate
      # from THIS workflow's OIDC identity. NEVER replace this with a manual laptop `npm publish`
      # on a CI-red — that mints laptop/personal-identity provenance permanently into Fulcio/Rekor.
      - name: Publish the verified bytes to npm with provenance
        run: npm publish "$TGZ" --provenance --access public --tag latest

      # ── POST-PUBLISH assertions. The npm page is immutable; these prove the just-published
      # provenance is honest. A failure here is a roll-FORWARD signal (publish 0.0.2), NEVER an
      # unpublish/flip-back.
      # --version pins the just-published version (not @latest) so a concurrent publish cannot race the
      # post-publish verifiers onto the wrong bytes. The verifiers fetch the real attestation BUNDLE
      # (dist.attestations.url) with a bounded retry for npm's post-publish attestation-indexing lag.
      - name: Provenance subject digest == gate digest
        run: node scripts/check-provenance-subject.mjs --package "$PKG_NAME" --version "$TAG_VERSION" --expect-digest "$GATE_SHA512"
      - name: Provenance predicate scrub — field-aware
        run: node scripts/check-provenance-predicate.mjs --package "$PKG_NAME" --version "$TAG_VERSION"
      - name: Rekor inclusion-proof issuer assertion
        run: node scripts/check-rekor-issuer.mjs --package "$PKG_NAME" --version "$TAG_VERSION" --expect-digest "$GATE_SHA512"
